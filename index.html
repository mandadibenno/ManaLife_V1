<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="ManaLife — your life, your people, your space. Personal and shared tasks, money, plans, health and more in one calm app." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>ManaLife — Your life. Your people. Your space.</title>
    <script>
      // Apply the saved theme before first paint (no white flash in dark mode).
      ;(function () {
        try {
          var p = JSON.parse(localStorage.getItem('manalife-theme') || '"system"')
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.background = dark ? '#0d0d11' : '#f7f6f3'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ManaLife needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
